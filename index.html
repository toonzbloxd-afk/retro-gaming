<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Gaming</title>
    <link rel="icon" href="favicon.png">
    <style>
        body { background: #1a1a2e; color: #fff; font-family: Arial, sans-serif; margin: 0; padding: 20px; }
        h1 { text-align: center; }
        .search-box {
            width: 100%; max-width: 500px; margin: 20px auto; padding: 12px 20px;
            font-size: 18px; border: none; border-radius: 25px;
            background: #16213e; color: #fff; outline: none;
        }
        .section-title { font-size: 22px; margin: 30px 0 15px; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px; max-width: 900px; margin: 0 auto;
        }
        .card {
            background: #16213e; border-radius: 12px; overflow: hidden;
            cursor: pointer; transition: transform 0.2s; text-align: center;
        }
        .card:hover { transform: scale(1.05); }
        .card img { width: 100%; height: 140px; object-fit: cover; }
        .card .thumb {
            width: 100%; height: 140px; background: #0f3460;
            display: flex; align-items: center; justify-content: center;
            font-size: 48px;
        }
        .card p { margin: 10px; font-size: 14px; }
    </style>
</head>
<body>
    <h1>🎮 Retro Gaming</h1>
    <input class="search-box" type="text" placeholder="Search games..." oninput="filterGames(this.value)">

    <h2 class="section-title">🆕 Latest</h2>
    <div class="grid" id="latest-grid">
        <a class="card" href="games/snake.html">
            <div class="thumb">🐍</div>
            <p>Snake</p>
        </a>
        <a class="card" href="games/tic-tac-toe.html">
            <div class="thumb">❌</div>
            <p>Tic-Tac-Toe</p>
        </a>
    </div>

    <h2 class="section-title">📋 All Games</h2>
    <div class="grid" id="all-grid">
        <a class="card" href="games/snake.html">
            <div class="thumb">🐍</div>
            <p>Snake</p>
        </a>
        <a class="card" href="games/tic-tac-toe.html">
            <div class="thumb">❌</div>
            <p>Tic-Tac-Toe</p>
        </a>
        <!-- ADD MORE GAMES HERE -->
    </div>

<script>
function filterGames(query) {
    const q = query.toLowerCase();
    document.querySelectorAll('.card').forEach(card => {
        const name = card.querySelector('p').textContent.toLowerCase();
        card.style.display = name.includes(q) ? '' : 'none';
    });
}
</script>
</body>
</html>
