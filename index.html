<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Gaming</title>
    <link rel="icon" href="favicon.png">
    <style>
        body { background: #1a1a2e; color: #fff; font-family: Arial, sans-serif; margin: 0; padding: 20px; text-align: center; }
        h1 { margin-bottom: 5px; }
        .page { display: none; }
        .page.active { display: block; }
        .search-box {
            width: 100%; max-width: 500px; margin: 20px auto; padding: 12px 20px;
            font-size: 18px; border: none; border-radius: 25px;
            background: #16213e; color: #fff; outline: none;
        }
        .section-title { font-size: 22px; margin: 30px 0 15px; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px; max-width: 900px; margin: 0 auto;
        }
        .card {
            background: #16213e; border-radius: 12px; overflow: hidden;
            cursor: pointer; transition: transform 0.2s; text-align: center;
        }
        .card:hover { transform: scale(1.05); }
        .card .thumb {
            width: 100%; height: 140px; background: #0f3460;
            display: flex; align-items: center; justify-content: center;
            font-size: 48px;
        }
        .card p { margin: 10px; font-size: 14px; }
        canvas { background: #0f3460; border-radius: 8px; }
        .score { font-size: 18px; margin: 10px 0; }
        .back-btn {
            display: inline-block; margin: 15px 0; padding: 8px 20px;
            background: #e94560; color: #fff; border: none; border-radius: 8px;
            font-size: 16px; cursor: pointer;
        }
        #ttt-board { display: grid; grid-template-columns: repeat(3,80px); gap: 4px; justify-content: center; margin: 20px auto; }
        #ttt-board div {
            width: 80px; height: 80px; background: #16213e; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 40px; cursor: pointer;
        }
        #ttt-board div:hover { background: #1a3a5c; }
        .game-bar {
            display: flex; justify-content: space-between; align-items: center;
            max-width: 500px; margin: 10px auto 0;
        }
        .game-name { font-size: 16px; font-weight: bold; }
        .vote-btns { display: flex; gap: 8px; }
        .vote-btn {
            padding: 6px 14px; border: none; border-radius: 6px;
            background: #16213e; color: #fff; font-size: 14px; cursor: pointer;
        }
        .vote-btn:hover { background: #1a3a5c; }
        .vote-btn.liked { background: #4ecca3; color: #000; }
        .vote-btn.disliked { background: #e94560; }
        .fs-btn {
            padding: 6px 14px; border: none; border-radius: 6px;
            background: #16213e; color: #fff; font-size: 14px; cursor: pointer;
        }
        .fs-btn:hover { background: #1a3a5c; }
        .game-area { position: relative; }
    </style>
</head>
<body>
    <h1>🎮 Retro Gaming</h1>

    <!-- HOME -->
    <div id="home" class="page active">
        <input class="search-box" type="text" placeholder="Search games..." oninput="filterGames(this.value)">
        <h2 class="section-title">🆕 Latest</h2>
        <div class="grid">
            <div class="card" onclick="go('bloxd')"><div class="thumb">🟦</div><p>Bloxd.io</p></div>
            <div class="card" onclick="go('snake')"><div class="thumb">🐍</div><p>Snake</p></div>
            <div class="card" onclick="go('ttt')"><div class="thumb">❌</div><p>Tic-Tac-Toe</p></div>
        </div>
        <h2 class="section-title">📋 All Games</h2>
        <div class="grid">
            <div class="card" onclick="go('snake')"><div class="thumb">🐍</div><p>Snake</p></div>
            <div class="card" onclick="go('ttt')"><div class="thumb">❌</div><p>Tic-Tac-Toe</p></div>
            <div class="card" onclick="go('bloxd')"><div class="thumb">🟦</div><p>Bloxd.io</p></div>
        </div>
    </div>

    <div style="position: relative; width: 100%; height: 600px;">
  <iframe
    src="https://www.crazygames.com/embed/evowarsio"
    style="width:100%; height:100%; border:none;"
    allow="gamepad *;"
    allowfullscreen
  ></iframe>
</div>   
    
    <!-- SNAKE -->
    <div id="snake" class="page">
        <button class="back-btn" onclick="go('home')">← Back</button>
        <div class="score">Score: <span id="s-score">0</span></div>
        <div class="game-area">
            <canvas id="s-canvas" width="300" height="300"></canvas>
        </div>
        <p>Use arrow keys to move</p>
        <div class="game-bar">
            <span class="game-name">Snake</span>
            <div class="vote-btns">
                <button class="vote-btn" onclick="vote('snake',1)">👍 <span id="snake-up">0</span></button>
                <button class="vote-btn" onclick="vote('snake',-1)">👎 <span id="snake-down">0</span></button>
            </div>
            <button class="fs-btn" onclick="toggleFS('snake')">⛶ Fullscreen</button>
        </div>
    </div>

    <!-- TIC TAC TOE -->
    <div id="ttt" class="page">
        <button class="back-btn" onclick="go('home')">← Back</button>
        <div class="score">Player: <span id="t-turn">❌</span></div>
        <div class="game-area">
            <div id="ttt-board"></div>
        </div>
        <p id="t-msg"></p>
        <div class="game-bar">
            <span class="game-name">Tic-Tac-Toe</span>
            <div class="vote-btns">
                <button class="vote-btn" onclick="vote('ttt',1)">👍 <span id="ttt-up">0</span></button>
                <button class="vote-btn" onclick="vote('ttt',-1)">👎 <span id="ttt-down">0</span></button>
            </div>
            <button class="fs-btn" onclick="toggleFS('ttt')">⛶ Fullscreen</button>
        </div>
    </div>

    <!-- BLOXD -->
    <div id="bloxd" class="page">
        <button class="back-btn" onclick="go('home')">← Back</button>
        <div class="game-area">
            <iframe src="https://www.crazygames.com/embed/bloxdhop-io" style="width:100%;height:80vh;border:none;border-radius:8px;" allow="gamepad *;"></iframe>
        </div>
    </div>   
    
<script>
function go(id) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    if (id === 'ttt') resetTTT();
    if (id === 'snake') resetSnake();
}

function filterGames(query) {
    const q = query.toLowerCase();
    document.querySelectorAll('.card').forEach(card => {
        const name = card.querySelector('p').textContent.toLowerCase();
        card.style.display = name.includes(q) ? '' : 'none';
    });
}

function toggleFS(id) {
    const el = document.getElementById(id);
    if (!document.fullscreenElement) {
        el.requestFullscreen();
    } else {
        document.exitFullscreen();
    }
}

function vote(game, val) {
    const key = 'vote_' + game;
    const current = parseInt(localStorage.getItem(key) || '0');
    if (current === val) {
        localStorage.setItem(key, '0');
    } else {
        localStorage.setItem(key, String(val));
    }
    updateVoteUI(game);
}

function updateVoteUI(game) {
    const val = parseInt(localStorage.getItem('vote_' + game) || '0');
    const upBtn = document.querySelector(`[onclick="vote('${game}',1)"]`);
    const downBtn = document.querySelector(`[onclick="vote('${game}',-1)"]`);
    upBtn.classList.toggle('liked', val === 1);
    downBtn.classList.toggle('disliked', val === -1);
}

const canvas = document.getElementById('s-canvas');
const ctx = canvas.getContext('2d');
let snake = [{x:150,y:150}], dir = {x:10,y:0}, food = {x:200,y:200}, score = 0;

function resetSnake() {
    snake = [{x:150,y:150}]; dir = {x:10,y:0}; score = 0;
    food = {x:200,y:200};
    drawSnake();
}

function drawSnake() {
    ctx.clearRect(0,0,300,300);
    ctx.fillStyle = '#e94560';
    ctx.fillRect(food.x, food.y, 10, 10);
    ctx.fillStyle = '#4ecca3';
    snake.forEach(s => ctx.fillRect(s.x, s.y, 10, 10));
    document.getElementById('s-score').textContent = score;
}

function updateSnake() {
    if (!document.getElementById('snake').classList.contains('active')) return;
    const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
    if (head.x < 0 || head.x >= 300 || head.y < 0 || head.y >= 300 || snake.some(s => s.x===head.x && s.y===head.y)) {
        resetSnake();
    } else {
        snake.unshift(head);
        if (head.x === food.x && head.y === food.y) {
            score += 10;
            food = {x: Math.floor(Math.random()*29)*10, y: Math.floor(Math.random()*29)*10};
        } else {
            snake.pop();
        }
    }
    drawSnake();
}
document.addEventListener('keydown', e => {
    if (e.key === 'ArrowUp') dir = {x:0,y:-10};
    if (e.key === 'ArrowDown') dir = {x:0,y:10};
    if (e.key === 'ArrowLeft') dir = {x:-10,y:0};
    if (e.key === 'ArrowRight') dir = {x:10,y:0};
});
setInterval(updateSnake, 120);
drawSnake();

const board = document.getElementById('ttt-board');
let cells = Array(9).fill(''), turn = '❌';
for (let i = 0; i < 9; i++) {
    const d = document.createElement('div');
    d.onclick = () => play(i, d);
    board.appendChild(d);
}
const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
function resetTTT() {
    cells = Array(9).fill(''); turn = '❌';
    document.getElementById('t-msg').textContent = '';
    document.getElementById('t-turn').textContent = '❌';
    board.querySelectorAll('div').forEach(d => d.textContent = '');
}
function play(i, d) {
    if (cells[i] || document.getElementById('t-msg').textContent) return;
    cells[i] = turn; d.textContent = turn;
    const w = wins.find(w => w.every(c => cells[c] === turn));
    if (w) { document.getElementById('t-msg').textContent = turn + ' wins! 🎉'; return; }
    if (!cells.includes('')) { document.getElementById('t-msg').textContent = "It's a draw!"; return; }
    turn = turn === '❌' ? '⭕' : '❌';
    document.getElementById('t-turn').textContent = turn;
}
</script>
</body>
</html>
